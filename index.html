<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood Connect BD</title>
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5;color:#222}
header{background:#d32f2f;color:white;text-align:center;padding:22px}
h1{margin:5px}
.container{padding:15px}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px}
input,select,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border:1px solid #ddd;border-radius:7px;font-size:16px}
button{background:#d32f2f;color:white;border:0;font-weight:bold}
.donor{background:white;padding:14px;margin:10px 0;border-radius:10px}
.call{display:block;background:#168b48;color:white;text-align:center;padding:12px;text-decoration:none;border-radius:7px}
small{color:#666}
</style>
</head>
<body>

<header>
<h1>🩸 Blood Connect BD</h1>
<p>রক্তদানে বাঁচুক প্রাণ</p>
<p>ছাগলনাইয়া, ফেনী</p>
</header>

<div class="container">

<div class="card">
<h3>🔍 ডোনার খুঁজুন</h3>
<select id="searchGroup">
<option value="">সব রক্তের গ্রুপ</option>
<option>A+</option><option>A-</option>
<option>B+</option><option>B-</option>
<option>O+</option><option>O-</option>
<option>AB+</option><option>AB-</option>
</select>
<input id="searchArea" placeholder="এলাকা লিখুন">
<button onclick="showDonors()">ডোনার খুঁজুন</button>
</div>

<div class="card">
<h3>🩸 ডোনার রেজিস্ট্রেশন</h3>
<form id="donorForm">
<input id="name" placeholder="আপনার নাম" required>
<input id="phone" type="tel" placeholder="মোবাইল নম্বর" required>
<select id="group" required>
<option value="">রক্তের গ্রুপ নির্বাচন করুন</option>
<option>A+</option><option>A-</option>
<option>B+</option><option>B-</option>
<option>O+</option><option>O-</option>
<option>AB+</option><option>AB-</option>
</select>
<input id="area" placeholder="আপনার এলাকা" required>
<label><input type="checkbox" id="consent" required style="width:auto">
আমি সম্মতি দিচ্ছি যে আমার তথ্য ডোনার খোঁজার জন্য দেখানো হবে।
</label>
<button type="submit">রেজিস্ট্রেশন করুন</button>
</form>
</div>

<h3>❤️ ডোনার তালিকা</h3>
<div id="donors"></div>

</div>

<script>
let donors=JSON.parse(localStorage.getItem("bloodDonors")||"[]");

function showDonors(){
let g=document.getElementById("searchGroup").value;
let a=document.getElementById("searchArea").value.toLowerCase();
let box=document.getElementById("donors");
box.innerHTML="";
let found=donors.filter(d=>
(!g||d.group===g)&&
(!a||d.area.toLowerCase().includes(a))
);
if(!found.length){
box.innerHTML="<p>কোনো ডোনার পাওয়া যায়নি।</p>";
return;
}
found.forEach(d=>{
box.innerHTML+=`
<div class="donor">
<h3>🩸 ${d.group}</h3>
<strong>${d.name}</strong>
<p>এলাকা: ${d.area}</p>
<a class="call" href="tel:${d.phone}">📞 ফোন করুন</a>
</div>`;
});
}

document.getElementById("donorForm").onsubmit=function(e){
e.preventDefault();
let d={
name:document.getElementById("name").value,
phone:document.getElementById("phone").value,
group:document.getElementById("group").value,
area:document.getElementById("area").value
};
donors.push(d);
localStorage.setItem("bloodDonors",JSON.stringify(donors));
this.reset();
showDonors();
alert("রেজিস্ট্রেশন সফল হয়েছে!");
};

showDonors();
</script>
</body>
</html>
